# THE PIPELINE: short, because it only CALLS the reusable workflow.
# Same shape as your GoCD pipeline: dev -> test -> prd, plan then apply.
name: pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:       # manual "Run workflow" button

jobs:
  tf-dev:
    uses: ./.github/workflows/reusable-terraform.yml
    with: { environment: dev }

  tf-test:
    needs: tf-dev
    uses: ./.github/workflows/reusable-terraform.yml
    with: { environment: test }

  tf-prd:
    needs: tf-test
    uses: ./.github/workflows/reusable-terraform.yml
    with: { environment: prd }   # apply pauses here until the reviewer approves
