# Thin pipeline: calls the shared recipe three times. Same shape as GoCD dev -> test -> prd.
name: pipeline
on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/pipeline.yml"]
  workflow_dispatch:

jobs:
  tf-dev:
    uses: guideveloper-raj/platform-workflows/.github/workflows/reusable-terraform.yml@v1
    with: { environment: dev, var_file: config/dev.tfvars }

  tf-test:
    needs: tf-dev
    uses: guideveloper-raj/platform-workflows/.github/workflows/reusable-terraform.yml@v1
    with: { environment: test, var_file: config/test.tfvars }

  tf-prd:
    needs: tf-test
    uses: guideveloper-raj/platform-workflows/.github/workflows/reusable-terraform.yml@v1
    with: { environment: prd, var_file: config/prd.tfvars }   # apply waits for the reviewer
