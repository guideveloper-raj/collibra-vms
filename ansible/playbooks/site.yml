# Configures what runs INSIDE the servers (Terraform created them).
# Here it just runs on the runner itself (connection=local) and writes a file.
- name: Configure collibra-lite
  hosts: collibra
  gather_facts: false
  tasks:
    - name: Show which environment we are configuring
      ansible.builtin.debug:
        msg: "Configuring {{ env_name }} with {{ edge_nodes }} edge node(s)"

    - name: Write a config file (idempotent: second run changes nothing)
      ansible.builtin.copy:
        dest: "/tmp/collibra-{{ env_name }}.conf"
        content: |
          environment={{ env_name }}
          edge_nodes={{ edge_nodes }}
